<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcronymPH</title>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <div id="home">
        <header>
            <h1>Gov Acronym PH</h1>
            <p>Type out 77 common PH government agency complete official name based on its acronyms.</p>
        </header>
        <div class="cards">
            <button class="easy-btn start-btn">Easy</button>
            <span class="easy-high-score"></span>
        </div>
        <div class="cards">
            <button class="intermediate-btn start-btn">Intermediate</button>
            <span class="intermediate-high-score"></span>
        </div>
        <div class="cards">
            <button class="hard-btn start-btn">Hard</button>
            <span class="hard-high-score"></span>
        </div>
    </div>
    <div id="game">
        <div class="board">
            <span class="back-btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="30px" width="30px" fill="#333">
                    <path d="M7.83,13l5.6,5.6L12,20L4,12l8-8l1.43,1.4L7.83,11H20v2H7.83Z" />
                </svg>
            </span>
            <div class="score-board">
                <span class="score-top">Score: 1 / 10</span>
                <span class="level-top">Level: 5 / 10</span>
                <span class="time-top">Time: 00:00:00</span>
            </div>
        </div>
        <div class="acronym-div">
            <span class="acronym">DepEd</span>
        </div>
        <div class="subdesc">
            <svg class="hint-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="24px" width="24px"
                fill="white">
                <path
                    d="M10.6,16q0-2.03 0.36-2.91t1.54-1.94q1.03-0.9 1.56-1.56T14.6,8.07q0-1.02-0.69-1.7T12,5.7q-1.27,0-1.94,0.77T9.13,8.05L6.55,6.95q0.52-1.6 1.92-2.78T12,3q2.63,0 4.04,1.46q1.41,1.46 1.41,3.51q0,1.25-0.54,2.14t-1.69,2.01Q14,13.3 13.74,13.91T13.48,16H10.6ZM12,22q-0.82,0-1.41-0.59T10,20t0.59-1.41T12,18t1.41,0.59Q14,19.18 14,20t-0.59,1.41T12,22Z" />
            </svg>
            <svg class="correct-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="24px" width="24px"
                fill="white">
                <path d="M9.55,18l-5.7-5.7l1.43-1.42l4.28,4.28l9.18-9.18L20.15,7.4L9.55,18Z" />
            </svg>
            <svg class="wrong-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="24px" width="24px"
                fill="white">
                <path
                    d="M8.4,17L7,15.6L10.6,12L7,8.42l1.4-1.4l3.6,3.6l3.58-3.6l1.4,1.4L13.38,12l3.6,3.6L15.58,17L12,13.4L8.4,17Z" />
            </svg>
            <span class="clue-span">manages basic education system</span>
            <span class="agency-span">Department of Education</span>
            <div class="end-result">
                <span class="score"></span>
                <span class="time"></span>
            </div>
        </div>
        <div class="input-div">
            <input type="text" placeholder="What does it stand for?">
        </div>
    </div>

    <script type="module" src="scripts/script.js"></script>
</body>

</html>
